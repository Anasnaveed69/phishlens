name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run test suite
        run: pytest -q --junitxml=test-results.xml
      - name: Synthetic end-to-end check (generate, train, evaluate)
        run: |
          python scripts/generate_synthetic.py --n 100 --out /tmp/syn
          python scripts/evaluate.py --data /tmp/syn --no-save --out /tmp/eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml
