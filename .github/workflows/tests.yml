name: tests

on:
  push:
  pull_request:

jobs:
  quality:
    name: lint + security scan + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: bandit -q -r app engine
      - run: pip-audit -r requirements.txt

  pytest:
    name: unit + API + security + fuzz tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests with coverage (must stay >= 90%)
        run: pytest -q --ignore=tests/e2e --cov=app --cov=engine --cov-branch --cov-fail-under=90 --junitxml=test-results.xml
      - name: Synthetic end-to-end check (generate, evaluate)
        run: |
          python scripts/generate_synthetic.py --n 100 --out /tmp/syn
          python scripts/evaluate.py --data /tmp/syn --no-save --out /tmp/eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: test-results.xml

  e2e:
    name: browser end-to-end + accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest tests/e2e -q
